[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kindof"
version = "0.1.0"
description = "Typed, JSON-compatible object inspection for Python."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "wispsy"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[tool.setuptools.packages.find]
include = ["kindof*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
